<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Медиатека «Рыба Моя»</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@font-face{font-family:"ArticaPro";src:url("fonts/ArticaPro.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"ArticaPro";src:url("fonts/ArticaPro-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Futura New";src:url("fonts/FuturaNewBook-Reg.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Futura New";src:url("fonts/FuturaNewMedium-Reg.woff2") format("woff2");font-weight:500;font-display:swap}
:root{--cream:#F9EFE3;--sand:#F3E3CF;--paper:#EFE3D3;--line:#E6D6C2;--line2:#D9C4AC;--ink:#3A2219;--ink2:#5C3F2C;--mute:#8A7465;--gold:#997234;--red:#B60E10;--blue:#104C82;--white:#FFFFFF;
  --safe-b:max(env(safe-area-inset-bottom),var(--tg-safe-area-inset-bottom,0px));--safe-t:var(--tg-content-safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink)}
body{font-family:"Futura New",Jost,"Century Gothic",Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input::placeholder{color:var(--mute)}
.app{position:relative;max-width:560px;margin:0 auto;height:var(--tg-viewport-stable-height,100dvh);min-height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--cream)}
.hd{position:relative;flex:none;overflow:hidden;padding-top:var(--safe-t)}
.koi{position:absolute;right:-14px;top:-80px;width:132px;opacity:.95;pointer-events:none;-webkit-mask-image:linear-gradient(to left,#000 45%,transparent);mask-image:linear-gradient(to left,#000 45%,transparent)}
.brand{position:relative;display:flex;flex-direction:column;gap:7px;padding:18px 16px 0}
.brand img{height:22px;width:auto;align-self:flex-start;display:block}
.kicker{font-family:ArticaPro,sans-serif;font-size:10px;letter-spacing:.36em;text-transform:uppercase;color:var(--gold)}
.search{position:relative;display:flex;align-items:center;gap:10px;height:46px;margin:14px 16px 0;padding:0 4px 0 12px;background:var(--white);border:1px solid var(--ink)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search input{flex:1;min-width:0;height:44px;border:0;outline:none;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
.search button{flex:none;width:40px;height:40px;border:0;background:transparent;color:var(--ink2);font-size:22px;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:10px 16px 0;border:1px solid var(--ink)}
.seg button{height:36px;border:0;background:transparent;font-size:13px;padding:0 4px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--white)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 14px;border:1px solid var(--line);background:var(--white);font-size:14px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:var(--white)}
.band{flex:none;height:10px;background:url(img/band.jpg) left center/auto 10px repeat-x}
.body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 20px}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--ink2)}
.sum span:last-child{font-size:12px;color:var(--mute);white-space:nowrap}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:18px 0 10px}
.gh h2{margin:0;font-family:ArticaPro,sans-serif;font-weight:400;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.gh span{font-size:12px;color:var(--mute);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;background:var(--white);min-width:0}
.tile.wide{grid-column:span 2}
.tbtn{width:100%;border:0;padding:0;background:transparent;text-align:left;display:flex;flex-direction:column}
.pic{position:relative;display:block;width:100%;aspect-ratio:1/1;background:var(--paper);overflow:hidden}
.tile.wide .pic{aspect-ratio:16/9}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.logo img{object-fit:contain;padding:14%}
.pic.dark{background:var(--ink)}
.pic.light{background:var(--white)}
.badge{position:absolute;left:0;bottom:0;padding:4px 8px;background:var(--ink);color:var(--white);font-size:12px;line-height:1.2}
.badge.mute{background:var(--mute)}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;background:var(--sand)}
.cover img{width:46px;height:46px;object-fit:contain}
.cover b{font-family:ArticaPro,sans-serif;font-weight:500;font-size:19px;line-height:1.1;color:var(--red);padding-bottom:30px;overflow-wrap:anywhere}
.spec{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:14px;background:var(--white);overflow:hidden}
.spec .aa{font-size:52px;line-height:1}
.spec .ln{font-size:15px;line-height:1.2}
.cap{display:flex;flex-direction:column;gap:3px;padding:8px 10px 10px}
.cap .t{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cap .s{font-size:12px;line-height:1.3;color:var(--mute)}
.sel{position:absolute;top:0;right:0;width:44px;height:44px;border:0;padding:0;background:transparent;display:flex;align-items:center;justify-content:center}
.sel span{width:24px;height:24px;border:1.5px solid var(--ink);background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center}
.sel[aria-pressed=true] span{border-color:var(--red);background:var(--red)}
.cta{position:relative;overflow:hidden;padding:18px 120px 18px 16px;background:var(--ink);color:var(--white);display:flex;flex-direction:column;gap:8px}
.cta img{position:absolute;right:-24px;top:-10px;width:150px;opacity:.9;-webkit-mask-image:linear-gradient(to left,#000 50%,transparent);mask-image:linear-gradient(to left,#000 50%,transparent)}
.cta b{position:relative;font-family:ArticaPro,sans-serif;font-weight:500;font-size:20px;line-height:1.1}
.cta span{position:relative;font-size:13px;line-height:1.45;color:var(--sand)}
.note{margin-top:14px;padding:16px;background:var(--white);display:flex;flex-direction:column;gap:10px}
.note .tt{font-family:ArticaPro,sans-serif;font-weight:500;font-size:20px;line-height:1.15}
.note p{margin:0;font-size:14px;line-height:1.45;color:var(--ink2)}
.empty{margin-top:14px;padding:24px 18px;background:var(--cream) url(img/coral.jpg) center/220px auto}
.outline{height:40px;padding:0 12px;border:1px solid var(--red);background:var(--white);color:var(--red);font-size:14px}
.more{display:block;width:100%;height:46px;margin-top:14px;border:1px solid var(--ink);background:var(--white);font-size:14px}
.selbar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:var(--white);border-top:2px solid var(--red)}
.selbar div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.selbar b{font-size:14px;font-weight:500}
.link{align-self:flex-start;height:24px;padding:0;border:0;background:transparent;color:var(--ink2);font-size:13px;text-decoration:underline}
.primary{flex:none;min-height:48px;padding:0 16px;border:0;background:var(--red);color:var(--white);font-size:15px;font-weight:500}
.primary[disabled]{opacity:.6}
nav.tabs{flex:none;display:flex;background:var(--white);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink2);font-size:12px;position:relative}
nav.tabs button[aria-current=page]{color:var(--red);font-weight:500}
nav.tabs .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:var(--white);font-size:11px;line-height:18px;font-weight:500}
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--cream)}
.ovh{flex:none;display:flex;align-items:center;gap:8px;height:56px;padding:0 12px 0 4px;background:var(--white);border-bottom:1px solid var(--line);margin-top:var(--safe-t)}
.back{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;border:0;background:transparent;font-size:15px}
.ovh .kicker{margin-left:auto;font-size:11px;letter-spacing:.24em}
.ovb{flex:1;min-height:0;overflow-y:auto}
.hero{position:relative;width:100%;aspect-ratio:1/1;background:var(--white);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:contain;display:block}
.hero.cov img{object-fit:cover}
.hero.logo img{padding:12%}
.hero.dark{background:var(--ink)}
.nav2{position:absolute;top:50%;margin-top:-24px;width:44px;height:48px;border:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}
.pos{position:absolute;right:0;top:0;padding:5px 10px;background:rgba(58,34,25,.85);color:var(--white);font-size:13px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 0;scrollbar-width:none}
.strip button{flex:none;position:relative;width:64px;height:64px;padding:0;border:2px solid transparent;background:var(--white)}
.strip button[aria-pressed=true]{border-color:var(--red)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.strip i{position:absolute;left:0;bottom:0;min-width:18px;padding:1px 4px;background:var(--ink);color:var(--white);font-size:11px;font-style:normal;line-height:1.3}
.info{padding:16px;display:flex;flex-direction:column;gap:14px}
.info h1{margin:0;font-family:ArticaPro,sans-serif;font-weight:500;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.meta{font-size:14px;line-height:1.4;color:var(--ink2)}
.q{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.q span:last-child{padding:3px 8px;border:1px solid var(--blue);color:var(--blue);font-size:12px;line-height:1.3}
.q.low span:last-child{border-color:var(--red);color:var(--red)}
.warn{margin:-6px 0 0;font-size:13px;line-height:1.45;color:var(--red)}
.acts{display:flex;flex-direction:column;gap:8px}
.acts .primary{min-height:52px;padding:8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.acts .primary small{font-size:12px;font-weight:400;color:#FBE3DD}
.sec{height:46px;border:1px solid var(--ink);background:var(--white);font-size:14px}
.sec.soft{border-color:var(--line2)}
.how{display:flex;flex-direction:column;gap:6px;padding:12px 14px;background:var(--white);border-left:3px solid var(--blue);font-size:13px;line-height:1.45}
.toast{position:absolute;left:12px;right:12px;bottom:calc(72px + var(--safe-b));z-index:30;padding:14px 14px 12px 16px;background:var(--ink);color:var(--white);display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 1px var(--sand)}
.toast span{font-size:14px;line-height:1.45}
.toast div{display:flex;justify-content:flex-end;gap:10px}
.toast button{height:36px;padding:0 14px;border:1px solid var(--white);background:transparent;color:var(--white);font-size:13px}
.toast button.go{background:var(--white);color:var(--ink)}
/* меню */
.mh{flex:none;position:relative;display:flex;flex-direction:column;gap:12px;padding:18px 16px 12px;overflow:hidden;padding-top:calc(18px + var(--safe-t))}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .r{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.prog .r b{font-family:ArticaPro,sans-serif;font-size:22px;font-weight:500;color:var(--red)}
.bar{height:6px;background:var(--line)}.bar i{display:block;height:6px;background:var(--red)}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--red);margin:0}
.ms{display:flex;flex-direction:column;padding-top:16px}
.ms .gh{padding:0 0 8px;border-bottom:1px solid var(--line2)}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--paper)}
.row .th{flex:none;position:relative;width:56px;height:56px;padding:0;border:0;background:var(--paper)}
.row .th img{width:56px;height:56px;object-fit:cover;display:block}
.row .th i{position:absolute;right:0;bottom:0;padding:1px 4px;background:var(--ink);color:var(--white);font-size:11px;font-style:normal;line-height:1.3}
.row .no{flex:none;width:56px;height:56px;border:1.5px dashed var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;line-height:1.15;color:var(--red)}
.row .nm{flex:1;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.row .ok{flex:none;font-size:12px;color:var(--blue);white-space:nowrap}
.row .up{flex:none;height:44px;padding:0 10px;border:1px solid var(--red);background:var(--white);color:var(--red);font-size:13px}
.barbox{margin:14px 0 0;padding:12px;background:var(--white);border-left:3px solid var(--gold);font-size:14px;line-height:1.45}
.bg2{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.bg2 .kicker{font-size:11px;letter-spacing:.24em}
.bg2 span:last-child{font-size:14px;line-height:1.55}
.bh{margin:18px 0 4px;font-family:ArticaPro,sans-serif;font-weight:500;font-size:20px;line-height:1.15}
/* проверка */
.card{display:flex;flex-direction:column;background:var(--white)}
.card .ph{width:100%;height:260px;background:var(--paper);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .in{padding:14px;display:flex;flex-direction:column;gap:12px}
.card .lb{font-family:ArticaPro,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.card .ai{font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.card .qq{font-family:ArticaPro,sans-serif;font-weight:500;font-size:20px;line-height:1.15}
.opt{min-height:48px;padding:10px 14px;border:1px solid var(--ink);background:var(--white);font-size:15px;line-height:1.3;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt small{font-size:12px;color:var(--ink2)}
.two{display:flex;gap:8px}.two button{flex:1;height:44px;border:1px solid var(--line2);background:var(--white);color:var(--ink2);font-size:14px}
.own{display:flex;gap:8px}.own input{flex:1;min-width:0;height:46px;border:1px solid var(--ink);padding:0 10px;font:inherit;font-size:16px;background:var(--white);color:var(--ink)}
.ok2{margin:12px 0 0;font-size:13px;line-height:1.4;color:var(--blue)}
.skel{background:linear-gradient(90deg,var(--paper),#F6ECDF,var(--paper));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px}
.center h1{margin:0;font-family:ArticaPro,sans-serif;font-weight:500;font-size:26px;line-height:1.1}
.center p{margin:0;font-size:15px;line-height:1.5;color:var(--ink2)}
.center img{width:120px;height:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

      <div style="display:flex;flex-direction:column;gap:4px"><span class="lb">ИИ подписал</span><span class="ai">${esc(it.title || '—')}${it.restaurant ? ' · ' + esc(it.restaurant) : ''}</span>${(it.opts || []).length ? '<span style="font-size:13px;color:var(--red)">Не уверен: под фото подходят несколько блюд меню.</span>' : '<span style="font-size:13px;color:var(--red)">Не уверен: такого точного названия нет в меню.</span>'}</div>
      <span class="qq">Как называется блюдо?</span><div class="acts">${opts}<button class="opt" data-act="rvpick" data-v="-1"${S.rvBusy ? ' disabled' : ''}><span>✓ Оставить «${esc(it.title || '')}»</span><small>подпись верная</small></button></div>
      ${S.rvOwn ? `<div class="own"><input id="rvown" placeholder="Название из меню" aria-label="Своё название" enterkeyhint="done"><button class="primary" data-act="rvsave">Сохранить</button></div>` : ''}
      <div class="two"><button data-act="rvskip">Пропустить</button><button data-act="rvown">✎ Своё название</button></div></div></article>`;
  }
  const left = r && !r.error ? r.left : 0, done = S.rvFixed + S.rvSkip, pct = left + done ? Math.round(done * 100 / (left + done)) : 0;
  return `<header class="mh"><img class="koi" src="img/koi.webp" alt="" aria-hidden="true"><div class="brand" style="padding:0"><img src="img/wordmark.png" alt="Рыба Моя"><span class="kicker">Медиатека · проверка</span></div>
    <div style="position:relative;display:flex;justify-content:space-between;align-items:baseline;margin-top:4px"><h1 style="margin:0;font-family:ArticaPro,sans-serif;font-weight:500;font-size:26px;line-height:1">Проверка</h1><span style="font-size:14px;color:var(--ink2)">осталось: <b style="font-weight:500">${left}</b></span></div>
    <div class="bar"><i style="width:${pct}%;background:var(--blue)"></i></div><span style="font-size:13px;line-height:1.4;color:var(--ink2)">Фото, где ИИ не уверен в названии блюда. Одно нажатие — и подпись исправлена.</span></header><div class="band" aria-hidden="true"></div><div class="body" style="padding-top:14px">${body}${S.rvLast ? `<p class="ok2" role="status">✓ ${esc(S.rvLast)}</p>` : ''}</div>`;
}
const menuOf = name => { const n = dishNorm(name), j = MENU_IDX.jp.has(n), r = MENU_IDX.rm.has(n); return j && r ? 'есть в меню обоих ресторанов' : j ? 'меню «Рыба Моя в Японии»' : r ? 'меню «Рыба Моя»' : 'нет в меню'; };

// ---------- действия ----------
function toast(text, go) { S.toast = { text, go: !!go }; render(); clearTimeout(S._tt); S._tt = setTimeout(() => { S.toast = null; render(); }, 9000); }
const haptic = k => { try { tg && tg.HapticFeedback && (k === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : k === 'err' ? tg.HapticFeedback.notificationOccurred('error') : tg.HapticFeedback.selectionChanged()); } catch (e) {} };
async function send(files) {
  if (S.sending || !files.length) return;
  if (files.length > 60) return toast('За один раз — до 60 файлов, а выбрано ' + files.length + '. Снимите часть отметок и отправьте в два приёма.');
  S.sending = true; render();
  try {
    const r = await rpc('media_app_send', { p_init: INIT, p_ids: files.map(f => f.id) });
    if (r && r.ok) {
      const low = files.filter(f => f.kind === 'photo').length, orig = files.length - low;
      haptic('ok');
      toast((orig ? 'Отправляю в чат ' + pl(orig, 'файл', 'файла', 'файлов') + ' оригиналами — без сжатия.' : 'Отправляю в чат.') + (low ? ' ' + low + ' — только сжатые копии, придут с пометкой.' : '') + ' Придут через несколько секунд.', true);
      S.sel.clear();
    } else { haptic('err'); toast(r && r.error === 'limit' ? 'Слишком много отправок за час — подождите немного.' : r && r.error === 'empty' ? 'Эти файлы больше недоступны — обновите каталог.' : r && r.error === 'auth' ? 'Вход устарел: закройте каталог и откройте снова кнопкой «Каталог».' : 'Не получилось отправить. Попробуйте ещё раз.'); }
  } catch (e) { haptic('err'); toast(e.message === 'net' ? 'Нет связи — проверьте интернет и попробуйте ещё раз.' : 'Не получилось отправить. Попробуйте ещё раз.'); }
  finally { S.sending = false; render(); }
}
async function rvLoad() {
  S.rv = null; render();
  try { const r = await rpc('media_app_review', { p_init: INIT, p_skip: S.rvSkip }); S.rv = r && r.ok ? r : { error: r && r.error === 'not_allowed' ? 'Проверка — для кураторов.' : 'Попробуйте ещё раз через минуту.' }; if (r && r.ok) S.me.review = r.left; }
  catch (e) { S.rv = { error: e.message === 'net' ? 'Нет связи.' : 'Попробуйте ещё раз через минуту.' }; }
  render();
}
async function rvSet(k, title) {
  const it = S.rv && S.rv.item; if (!it || S.rvBusy) return;
  S.rvBusy = true; render();
  try {
    const r = await rpc('media_app_review_set', { p_init: INIT, p_id: it.id, p_k: k, p_title: title || null });
    if (r && r.ok) { haptic('ok'); S.rvFixed++; S.rvLast = 'Сохранено: ' + (r.title || it.title); S.rvOwn = false;
      const p = S.items.find(x => x.id === it.id); if (p && r.title) p.title = r.title; }
    else { haptic('err'); S.rvLast = 'Не сохранилось — попробуйте ещё раз.'; }
  } catch (e) { S.rvLast = 'Нет связи — не сохранилось.'; }
  S.rvBusy = false; await rvLoad();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, k = b.dataset.k;
  if (a === 'only') return; // флажок — в change
  if (a === 'tab') { S.tab = v; S.open = null; S.toast = null; if (v === 'review' && !S.rv) rvLoad(); render(); document.querySelector('.body') && (document.querySelector('.body').scrollTop = 0); return; }
  if (a === 'rest') { S.rest = v; S.limit = 60; haptic(); return render(); }
  if (a === 'sec') { S.sec = v; S.limit = 60; haptic(); render(); const c = document.querySelector('.chips [aria-pressed=true]'); c && c.scrollIntoView({ inline: 'center', block: 'nearest' }); return; }
  if (a === 'clearq') { S.q = ''; S.limit = 60; S._focusQ = true; return render(); }
  if (a === 'more') { S.limit += 60; S._keepScroll = true; return render(); }
  if (a === 'open') { S.open = k; S.ph = 0; return render(); }
  if (a === 'close') { S.open = null; S._keepScroll = true; return render(); }
  if (a === 'ph') { S.ph = Number(v) || 0; return render(); }
  if (a === 'sel') { if (S.sel.has(k)) S.sel.delete(k); else S.sel.add(k); haptic(); S._keepScroll = true; return render(); }
  if (a === 'clearsel') { S.sel.clear(); S._keepScroll = true; return render(); }
  if (a === 'sendsel') return send([...S.sel].map(x => S.byKey[x]).filter(Boolean).reduce((acc, p) => acc.concat(p.files), []));
  if (a === 'sendone') { const p = S.byKey[S.open]; if (!p) return; return send(v === 'all' ? p.files : [p.files[Number(v)]].filter(Boolean)); }
  if (a === 'hidetoast') { S.toast = null; return render(); }
  if (a === 'gochat') { if (tg) tg.close(); return; }
  if (a === 'mtab') { S.mtab = v; S.only = false; return render(); }
  if (a === 'upload') return toast('Пришлите боту фото «' + v + '» файлом (📎 → «Файл»), в подписи — это название. Оно встанет сюда, а блюдо пропадёт из списка «без фото».', true);
  if (a === 'retry') return boot();
  if (a === 'reload') return boot(true);
  if (a === 'rvload') return rvLoad();
  if (a === 'rvpick') return rvSet(Number(v), null);
  if (a === 'rvskip') { S.rvSkip++; S.rvOwn = false; S.rvLast = ''; return rvLoad(); }
  if (a === 'rvagain') { S.rvSkip = 0; return rvLoad(); }
  if (a === 'rvown') { S.rvOwn = !S.rvOwn; render(); const i = document.getElementById('rvown'); i && i.focus(); return; }
  if (a === 'rvsave') { const i = document.getElementById('rvown'); const t = i ? i.value.trim() : ''; if (t.length < 2) return; return rvSet(null, t); }
});
document.addEventListener('change', e => { if (e.target && e.target.dataset && e.target.dataset.act === 'only') { S.only = e.target.checked; render(); } });
let qTimer = null;
document.addEventListener('input', e => { if (e.target && e.target.id === 'q') { S.q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(() => { S.limit = 60; refreshCatalog(); }, 150); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'q') e.target.blur(); if (e.key === 'Enter' && e.target && e.target.id === 'rvown') { const t = e.target.value.trim(); if (t.length >= 2) rvSet(null, t); } if (e.key === 'Escape' && S.open) { S.open = null; render(); } });

async function boot(quiet) {
  if (!tg || !INIT) { S.stage = 'err'; S.err = 'notg'; return render(); }
  if (!/^https:\/\//.test(SB) && !/^http:\/\/(127\.0\.0\.1|localhost)/.test(SB) || !KEY) { S.stage = 'err'; S.err = 'cfg'; return render(); }
  if (!quiet || S.stage !== 'ok') { S.stage = 'load'; render(); }
  S.loadedAt = Date.now();
  try {
    const r = await rpc('media_app_boot', { p_init: INIT });
    if (!r || !r.ok) { S.stage = 'err'; S.err = (r && r.error) || 'x'; return render(); }
    S.me = { role: r.role, name: r.name, review: r.review || 0 };
    build(r.items || []);
    for (const k of [...S.sel]) if (!S.byKey[k]) S.sel.delete(k);
    if (S.open && !S.byKey[S.open]) S.open = null;
    S.stage = 'ok';
  } catch (e) { if (!quiet || S.stage !== 'ok') { S.stage = 'err'; S.err = e.message; } }
  S._keepScroll = !!quiet; render();
}
// вернулись в каталог (например, после загрузки файлов в чат) — тихо подтянуть свежее
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.stage === 'ok' && Date.now() - (S.loadedAt || 0) > 30000) boot(true); });
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#F9EFE3'); tg.setBackgroundColor && tg.setBackgroundColor('#F9EFE3'); if (tg.setBottomBarColor) tg.setBottomBarColor('#FFFFFF'); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  tg.BackButton && tg.BackButton.onClick(() => { if (S.open) { S.open = null; S._keepScroll = true; render(); } });
}
boot();
</script>
